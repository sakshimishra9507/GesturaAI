{% extends "base.html" %}{% block title %}History{% endblock %}{% block content %}<section class="card"><h1>Recognition History</h1><table><tr><th>Gesture</th><th>Confidence</th><th>Time</th></tr>{% for r in records %}<tr><td>{{r.label}}</td><td>{{"%.1f"|format(r.confidence*100)}}%</td><td>{{r.created_at}}</td></tr>{% else %}<tr><td colspan="3">No records.</td></tr>{% endfor %}</table></section>{% endblock %}
